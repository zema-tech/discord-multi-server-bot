<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Hero dashboard — Gradient</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 600px; overflow: hidden;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #14122b; color: #fff; position: relative;
  }
  .mesh {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 500px at 15% 20%, rgba(88,101,242,.85), transparent 60%),
      radial-gradient(800px 520px at 85% 15%, rgba(92,200,255,.55), transparent 60%),
      radial-gradient(1000px 600px at 55% 110%, rgba(121,131,255,.7), transparent 60%),
      radial-gradient(600px 400px at 90% 90%, rgba(87,242,135,.35), transparent 60%),
      #14122b;
  }
  .grain {
    position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.14) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(700px 380px at 70% 45%, #000, transparent 70%);
  }
  .content {
    position: relative; z-index: 2; height: 100%;
    padding: 70px 150px;
    display: flex; align-items: center; gap: 80px;
  }
  .copy { max-width: 880px; }
  .badge {
    display: inline-block; font-size: 22px; font-weight: 700; letter-spacing: 4px;
    padding: 12px 26px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12);
    backdrop-filter: blur(8px); margin-bottom: 30px;
  }
  h1 { font-size: 104px; line-height: 1.02; font-weight: 800; letter-spacing: -2px; }
  h1 .grad {
    background: linear-gradient(92deg, #5cc8ff, #57f287);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { font-size: 34px; line-height: 1.4; color: rgba(255,255,255,.82); margin: 28px 0 50px; max-width: 760px; }
  .cta-row { display: flex; gap: 24px; align-items: center; }
  .cta {
    font-size: 32px; font-weight: 800; color: #14122b; background: #fff;
    padding: 24px 58px; border-radius: 18px; min-height: 44px;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  .cta-alt { font-size: 28px; font-weight: 600; color: #fff; opacity: .85; }
  .card {
    margin-left: auto; width: 560px; border-radius: 28px; padding: 46px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(18px); box-shadow: 0 30px 80px rgba(0,0,0,.35);
  }
  .card h2 { font-size: 26px; letter-spacing: 3px; opacity: .7; margin-bottom: 26px; }
  .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0; border-top: 1px solid rgba(255,255,255,.18); font-size: 30px; }
  .stat b { font-size: 44px; }
  .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: #57f287; margin-right: 12px; box-shadow: 0 0 14px #57f287; }
</style>
</head>
<body>
  <div class="mesh"></div>
  <div class="grain"></div>
  <div class="content">
    <div class="copy">
      <span class="badge">🤖 DISCORD BOT • DASHBOARD</span>
      <h1>Il tuo server,<br><span class="grad">sotto controllo.</span></h1>
      <p>Moduli, ticket, livelli ed AI — gestisci tutto da un'unica dashboard, senza toccare il codice.</p>
      <div class="cta-row">
        <span class="cta">Apri la dashboard →</span>
        <span class="cta-alt">Gratis • 2 minuti</span>
      </div>
    </div>
    <div class="card">
      <h2><span class="dot"></span>LIVE</h2>
      <div class="stat"><span>Server connessi</span><b>12</b></div>
      <div class="stat"><span>Ticket aperti</span><b>3</b></div>
      <div class="stat"><span>Moduli attivi</span><b>15/15</b></div>
    </div>
  </div>
</body>
</html>
