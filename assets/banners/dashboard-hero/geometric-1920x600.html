<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Hero dashboard — Geometric</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 600px; overflow: hidden;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f2f4fa; color: #14122b; position: relative;
  }
  .shape { position: absolute; }
  .c1 { width: 560px; height: 560px; border-radius: 50%; background: #5865f2; right: -140px; top: -180px; }
  .c2 { width: 220px; height: 220px; border-radius: 50%; background: #57f287; right: 420px; bottom: -90px; }
  .c3 { width: 130px; height: 130px; border-radius: 50%; background: #fee75c; right: 120px; bottom: 90px; }
  .sq { width: 180px; height: 180px; background: #14122b; border-radius: 36px; right: 640px; top: 60px; transform: rotate(18deg); }
  .ring { width: 300px; height: 300px; border-radius: 50%; border: 34px solid rgba(88,101,242,.25); right: 330px; top: 120px; }
  .panel {
    position: absolute; right: 90px; top: 90px; width: 480px; background: #fff;
    border-radius: 24px; padding: 40px; box-shadow: 0 30px 70px rgba(20,18,43,.18);
  }
  .panel h2 { font-size: 24px; letter-spacing: 3px; color: #7d8699; margin-bottom: 20px; }
  .row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 2px solid #f2f4fa; font-size: 28px; font-weight: 600; }
  .pill { width: 22px; height: 22px; border-radius: 50%; }
  .on { background: #57f287; } .off { background: #d7dce9; }
  .row b { margin-left: auto; font-size: 26px; color: #5865f2; }
  .content { position: relative; z-index: 2; height: 100%; padding: 80px 150px; max-width: 1080px; }
  .badge {
    display: inline-block; font-size: 22px; font-weight: 800; letter-spacing: 4px;
    color: #5865f2; border: 3px solid #5865f2; border-radius: 999px;
    padding: 10px 26px; margin-bottom: 30px;
  }
  h1 { font-size: 100px; line-height: 1.0; font-weight: 800; letter-spacing: -2px; }
  h1 mark { background: #fee75c; color: #14122b; padding: 0 18px; border-radius: 12px; }
  p { font-size: 32px; line-height: 1.45; color: #4a4f66; margin: 28px 0 46px; max-width: 700px; }
  .cta-row { display: flex; align-items: center; gap: 26px; }
  .cta {
    font-size: 32px; font-weight: 800; color: #fff; background: #5865f2;
    padding: 24px 58px; border-radius: 18px; min-height: 44px;
    box-shadow: 0 18px 40px rgba(88,101,242,.4);
  }
  .cta-alt { font-size: 28px; font-weight: 600; color: #4a4f66; }
</style>
</head>
<body>
  <div class="shape c1"></div>
  <div class="shape ring"></div>
  <div class="shape sq"></div>
  <div class="shape c2"></div>
  <div class="shape c3"></div>
  <div class="panel">
    <h2>MODULI</h2>
    <div class="row"><span class="pill on"></span>Ticket<b>ON</b></div>
    <div class="row"><span class="pill on"></span>Livelli<b>ON</b></div>
    <div class="row"><span class="pill on"></span>Automod<b>ON</b></div>
    <div class="row"><span class="pill off"></span>Starboard<b>OFF</b></div>
  </div>
  <div class="content">
    <span class="badge">🤖 ZEALBOT</span>
    <h1>Gestisci tutto<br>da <mark>un posto solo.</mark></h1>
    <p>La dashboard del bot: config dei moduli, ticket, statistiche e AI — in italiano, senza codice.</p>
    <div class="cta-row">
      <span class="cta">Apri la dashboard →</span>
      <span class="cta-alt">Setup in 2 minuti</span>
    </div>
  </div>
</body>
</html>
