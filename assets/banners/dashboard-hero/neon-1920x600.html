<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Hero dashboard — Neon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 600px; overflow: hidden;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #1e1f22; color: #fff; position: relative;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(88,101,242,.14) 1px, transparent 1px),
      linear-gradient(90deg, rgba(88,101,242,.14) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(1100px 520px at 50% 50%, #000 30%, transparent 75%);
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(110px); }
  .g1 { width: 520px; height: 520px; left: -140px; top: -160px; background: rgba(88,101,242,.5); }
  .g2 { width: 420px; height: 420px; right: 6%; bottom: -200px; background: rgba(87,242,135,.28); }
  .content {
    position: relative; z-index: 2; height: 100%;
    padding: 70px 150px; display: flex; align-items: center;
  }
  .copy { max-width: 1150px; }
  .kicker {
    font-size: 24px; font-weight: 800; letter-spacing: 6px; color: #57f287;
    text-shadow: 0 0 18px rgba(87,242,135,.8); margin-bottom: 24px;
  }
  h1 {
    font-size: 118px; line-height: .98; font-weight: 900; letter-spacing: -3px;
    text-transform: uppercase;
  }
  h1 .neon {
    color: #5865f2;
    text-shadow: 0 0 12px rgba(88,101,242,.9), 0 0 60px rgba(88,101,242,.6), 0 0 120px rgba(88,101,242,.4);
  }
  h1 .stroke {
    color: transparent; -webkit-text-stroke: 3px #fff;
  }
  p { font-size: 32px; color: #b9c0d4; margin: 30px 0 48px; max-width: 820px; }
  .cta-row { display: flex; align-items: center; gap: 28px; }
  .cta {
    font-size: 32px; font-weight: 800; color: #0a0b0e; background: #57f287;
    padding: 24px 60px; border-radius: 14px; min-height: 44px;
    box-shadow: 0 0 24px rgba(87,242,135,.65), 0 0 80px rgba(87,242,135,.3);
  }
  .meta { font-size: 26px; color: #7d8699; }
  .meta b { color: #fff; }
  .side {
    margin-left: auto; text-align: right; font-weight: 900;
    font-size: 300px; line-height: .85; letter-spacing: -8px;
    color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.22);
    user-select: none;
  }
  .side small { display: block; font-size: 40px; letter-spacing: 10px; -webkit-text-stroke: 0; color: #5865f2; text-shadow: 0 0 24px rgba(88,101,242,.7); }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="content">
    <div class="copy">
      <div class="kicker">● ONLINE — DISCORD BOT DASHBOARD</div>
      <h1><span class="stroke">Comanda</span><br><span class="neon">il tuo server</span></h1>
      <p>Ticket, livelli, automod e AI in un pannello unico. Accendi i moduli, cambia la config, invia annunci.</p>
      <div class="cta-row">
        <span class="cta">Apri la dashboard →</span>
        <span class="meta"><b>88</b> comandi • <b>15</b> moduli • <b>20</b> tool MCP</span>
      </div>
    </div>
    <div class="side">BOT<small>/DASH</small></div>
  </div>
</body>
</html>
