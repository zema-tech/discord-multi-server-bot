<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accesso — Mission Control</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/site.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<nav class="nav">
  <a class="brand" href="/"><span class="brand-mark">🎛️</span>Mission&nbsp;Control</a>
</nav>
<div class="login-wrap">
  <div class="login-card">
    <span class="brand-mark" style="width:52px;height:52px;font-size:1.7rem;">🎛️</span>
    <h1>Accesso operatore</h1>
    <p>Handshake col Commander via OAuth Discord. Niente password da ricordare.</p>
    <div class="boot" id="boot" aria-hidden="true"></div>
    <a class="btn btn-primary" id="loginBtn" href="/login" style="width:100%;justify-content:center;">Accedi con Discord</a>
    <p style="margin-top:1rem;font-size:0.8rem;color:var(--text-dim);">Sessione cifrata · solo i tuoi server gestibili</p>
  </div>
</div>
<script>
(function () {
  var lines = [
    '<span class="ok">✔</span> canale sicuro',
    '<span class="ok">✔</span> oauth discord pronto',
    '<span class="ok">✔</span> commander in ascolto',
    '<span style="color:var(--accent-soft)">→</span> in attesa di operatore…'
  ];
  var el = document.getElementById('boot');
  var i = 0;
  var t = setInterval(function () {
    if (i >= lines.length || !el) { clearInterval(t); return; }
    el.innerHTML += (i ? '<br>' : '') + lines[i++];
  }, 420);
})();
</script>
</body>
</html>
