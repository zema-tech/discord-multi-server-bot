<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accedi con Discord per gestire i tuoi server.">
  <title>Accedi — Multi-Server Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --border: #2a2e38;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --text: #f2f3f5;
      --muted: #b5bac1;
      --radius: 16px;
      --danger: #f04747;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      line-height: 1.5;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(88, 101, 242, 0.12);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }
    .logo svg { width: 30px; height: 30px; }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.4rem; }
    .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
    .error {
      display: none;
      background: rgba(240, 71, 71, 0.1);
      border: 1px solid rgba(240, 71, 71, 0.4);
      color: #ff9a9a;
      font-size: 0.85rem;
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      margin-bottom: 1.25rem;
      overflow-wrap: break-word;
    }
    .error.visible { display: block; }
    .btn-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.85rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn-login:hover { background: var(--accent-hover); }
    .btn-login:active { transform: translateY(1px); }
    .btn-login svg { width: 22px; height: 22px; flex-shrink: 0; }
    .scopes { margin-top: 1.25rem; font-size: 0.8rem; color: var(--muted); }
    .scopes code {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.1rem 0.35rem;
      border-radius: 6px;
      font-size: 0.78rem;
      color: var(--text);
    }
    .home { margin-top: 1.25rem; font-size: 0.9rem; }
    .home a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .home a:hover { text-decoration: underline; }
    a:focus-visible, .btn-login:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 6px;
    }
    @media (max-width: 480px) {
      .card { padding: 2rem 1.25rem; }
      h1 { font-size: 1.3rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none; animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" stroke="#5865F2" stroke-width="2.4" stroke-linecap="round" role="img">
        <line x1="5" y1="10" x2="27" y2="10" stroke="#2a2e38"></line>
        <line x1="5" y1="16" x2="27" y2="16" stroke="#2a2e38"></line>
        <line x1="5" y1="22" x2="27" y2="22" stroke="#2a2e38"></line>
        <circle cx="12" cy="10" r="3.2" fill="#1a1d24"></circle>
        <circle cx="20" cy="16" r="3.2" fill="#1a1d24"></circle>
        <circle cx="10" cy="22" r="3.2" fill="#1a1d24"></circle>
      </svg>
    </span>
    <h1>Accedi</h1>
    <p class="sub">Accedi per gestire i tuoi server Discord.</p>
    <p class="error" id="login-error" role="alert"></p>
    <a class="btn-login" href="/login">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6.5C7.5 4.8 11 4.8 12 4.8s4.5 0 8 1.7l.9 8.1c0 2.3-1.5 3.9-2.4 3.9l-1.9-1.7h-2.1l.5 1H8.9l.5-1H7.3L5.4 18.5c-.9 0-2.4-1.6-2.4-3.9L4 6.5Z"></path>
        <circle cx="9.3" cy="12.2" r="1.1" fill="currentColor" stroke="none"></circle>
        <circle cx="14.7" cy="12.2" r="1.1" fill="currentColor" stroke="none"></circle>
      </svg>
      Accedi con Discord
    </a>
    <p class="scopes">L'accesso usa solo gli ambiti <code>identify</code> + <code>guilds</code>.</p>
    <p class="home"><a href="/">← Torna alla home</a></p>
  </main>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var err = params.get("error");
        if (err) {
          var box = document.getElementById("login-error");
          box.textContent = err;
          box.classList.add("visible");
        }
      } catch (e) { /* ignora: nessun errore da mostrare */ }
    })();
  </script>
</body>
</html>
