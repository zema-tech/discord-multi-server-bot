<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accedi al pannello di gestione Multi-Server Bot per configurare moderazione, ticket e livelli.">
  <meta name="theme-color" content="#0f1115">
  <title>Multi-Server Bot — Accesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background-color: #0f1115;
      background-image: radial-gradient(600px 320px at 50% -60px, rgba(88, 101, 242, 0.16), transparent);
      color: #f2f3f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: #5865F2;
      color: #fff;
      padding: 10px 16px;
      border-radius: 0 0 12px 0;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      z-index: 10;
    }

    .skip-link:focus {
      left: 0;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #1a1d24;
      border: 1px solid #2a2e38;
      border-radius: 16px;
      padding: 40px 36px 32px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      animation: rise 0.6s ease-out both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: #5865F2;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(88, 101, 242, 0.35);
    }

    .logo svg { display: block; }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #f2f3f5;
    }

    .subtitle {
      margin: 0 0 28px;
      font-size: 15px;
      line-height: 1.55;
      color: #b5bac1;
    }

    .login-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      color: #ffffff;
      background: #5865F2;
      border: none;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }

    .login-btn:hover {
      background: #4752c4;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(88, 101, 242, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .login-btn svg { flex-shrink: 0; }

    .login-btn:focus-visible,
    a:focus-visible {
      outline: 3px solid #5865F2;
      outline-offset: 3px;
      border-radius: 8px;
    }

    .note {
      margin: 20px 0 0;
      font-size: 13px;
      line-height: 1.5;
      color: #b5bac1;
    }

    @media (max-width: 480px) {
      body { padding: 16px 12px; }
      .card { padding: 32px 24px 28px; }
      h1 { font-size: 22px; }
      .subtitle { font-size: 14px; }
      .login-btn { padding: 14px 20px; font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .card { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#contenuto">Salta al contenuto</a>

  <main class="card" id="contenuto" aria-labelledby="titolo">
    <div class="logo" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <line x1="5" y1="9" x2="25" y2="9" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
        <circle cx="18" cy="9" r="3.4" fill="#ffffff"/>
        <line x1="5" y1="15.5" x2="25" y2="15.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
        <circle cx="11" cy="15.5" r="3.4" fill="#ffffff"/>
        <line x1="5" y1="22" x2="25" y2="22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
        <circle cx="19" cy="22" r="3.4" fill="#ffffff"/>
      </svg>
    </div>

    <h1 id="titolo">Multi-Server Bot</h1>
    <p class="subtitle">Gestisci moderazione, ticket e livelli da un unico pannello.</p>

    <a class="login-btn" href="/login">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <path d="M19.6 5.1A16.4 16.4 0 0 0 15.5 4l-.2.4a13 13 0 0 1 3.3 1.7 15 15 0 0 0-13.2 0A13 13 0 0 1 8.7 4.4L8.5 4a16.4 16.4 0 0 0-4.1 1.1C1.7 9.2 1 13.2 1.4 17.1A16.6 16.6 0 0 0 6.4 20l.5-.8c-.3-.1-.6-.3-.8-.5l.2-.1a12 12 0 0 0 10.4 0l.2.1c-.2.2-.5.4-.8.5l.5.8a16.6 16.6 0 0 0 5-2.9c.5-4.5-.8-8.5-3-12zM8.7 14.3c-.8 0-1.4-.7-1.4-1.6 0-.9.6-1.6 1.4-1.6.8 0 1.4.7 1.4 1.6 0 .9-.6 1.6-1.4 1.6zm6.6 0c-.8 0-1.4-.7-1.4-1.6 0-.9.6-1.6 1.4-1.6.8 0 1.4.7 1.4 1.6 0 .9-.6 1.6-1.4 1.6z" fill="#ffffff"/>
      </svg>
      Accedi con Discord
    </a>

    <p class="note">Accesso riservato ai gestori dei server &middot; scope identify+guilds</p>
  </main>
</body>
</html>
