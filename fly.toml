# Fly.io — deploy del bot (Dockerfile root). Dashboard Next: app separata
# con Dockerfile = apps/dashboard/Dockerfile (copia questo file e cambia).
# Uso: fly launch --no-deploy && fly volumes create bot_data -s 1 && fly deploy
app = "zealbot"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DB_BACKEND = "sqlite"
  DB_SQLITE_PATH = "/app/data/bot.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  [http_service.checks.healthz]
    grace_period = "30s"
    path = "/healthz"

[[mounts]]
  source = "bot_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
